<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08783f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BAAC POS">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<title>BAAC POS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #eef5ef;
  color: #173d30;
  font: 16px 'FC Subject Rounded', sans-serif;
}

main {
  width: min(100%, 420px);
  text-align: center;
  background: white;
  padding: 32px 24px;
  border: 1px solid #dce9df;
  border-radius: 24px;
}

img {
  width: 132px;
  height: 132px;
}

h1 {
  margin: 12px 0 4px;
}

p {
  line-height: 1.6;
}

a, button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 0;
  border-radius: 12px;
  font: inherit;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

a {
  background: #08783f;
  color: white;
}

button {
  background: #e0efe5;
  color: #125c38;
}

small {
  display: block;
  line-height: 1.6;
  color: #50675a;
}

button[hidden] {
  display: none;
}
</style>
</head>

<body>

<main>

  <img src="icon-192.png" alt="BAAC POS">

  <h1>BAAC POS</h1>

  <p>ระบบบริหารร้านฝากขายอัจฉริยะ</p>

  <a href="https://script.google.com/macros/s/AKfycbzMmqNlT9ivhoOn4AFJUU6k9CDpPqTR1AWML3D2-C55AWtYTyvGNjREQlh8Z2KDDg/exec">
    เข้าสู่ระบบ BAAC POS →
  </a>

  <button id="install" type="button">
    ติดตั้งแอป
  </button>

  <small id="help">
    ติดตั้งผ่านเมนูเบราว์เซอร์: เพิ่มไปยังหน้าจอโฮม หรือ ติดตั้งแอป
    <br>
    การใช้งานระบบขายต้องเชื่อมต่ออินเทอร์เน็ต
  </small>

</main>

<script>

let promptEvent = null;

const button = document.getElementById('install');
const help = document.getElementById('help');

function isInstalled() {
  return (
    window.matchMedia('(display-mode: standalone)').matches ||
    navigator.standalone === true
  );
}

function updateInstallStatus() {
  if (isInstalled()) {
    button.hidden = true;
    help.textContent =
      'การใช้งานระบบขายต้องเชื่อมต่ออินเทอร์เน็ต';
  } else {
    button.hidden = false;
  }
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  promptEvent = e;
  updateInstallStatus();
});

button.addEventListener('click', async () => {

  if (promptEvent) {
    const p = promptEvent;
    promptEvent = null;

    try {
      await p.prompt();

      const result = await p.userChoice;

      if (result.outcome === 'accepted') {
        button.hidden = true;
      }
    } catch (error) {
      button.hidden = false;
    }

    return;
  }

  const isIOS =
    /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (
      navigator.platform === 'MacIntel' &&
      navigator.maxTouchPoints > 1
    );

  if (isIOS) {

    alert(
      'วิธีติดตั้ง BAAC POS\n\n' +
      '1. กดปุ่มแชร์\n' +
      '2. เลือก เพิ่มไปยังหน้าจอโฮม\n' +
      '3. ตั้งชื่อ BAAC POS\n' +
      '4. กดเพิ่ม\n\n' +
      'หากไม่พบเมนู ให้เปิดเว็บไซต์ผ่าน Safari'
    );

  } else {

    alert(
      'วิธีติดตั้ง BAAC POS\n\n' +
      '1. เปิดเมนูของเบราว์เซอร์\n' +
      '2. เลือก ติดตั้งแอป หรือ เพิ่มไปยังหน้าจอหลัก\n' +
      '3. กดยืนยันการติดตั้ง'
    );

  }

});

window.addEventListener('appinstalled', () => {
  promptEvent = null;
  button.hidden = true;
  help.textContent =
    'ติดตั้ง BAAC POS เรียบร้อยแล้ว';
});

updateInstallStatus();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker
    .register('./sw.js')
    .catch(console.warn);
}

</script>

</body>
</html>
