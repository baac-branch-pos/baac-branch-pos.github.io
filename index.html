<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08783f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BAAC POS"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><title>BAAC POS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#eef5ef;color:#173d30;font:16px system-ui,sans-serif}main{width:min(100%,420px);text-align:center;background:white;padding:32px 24px;border:1px solid #dce9df;border-radius:24px}img{width:132px;height:132px}h1{margin:12px 0 4px}p{line-height:1.6}a,button{display:block;width:100%;padding:14px;margin:12px 0;border:0;border-radius:12px;font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}a{background:#08783f;color:white}button{background:#e0efe5;color:#125c38}small{display:block;line-height:1.6;color:#50675a}button[hidden]{display:none}</style></head><body><main><img src="icon-192.png" alt="BAAC POS"><h1>BAAC POS</h1><p>ระบบบริหารร้านฝากขายอัจฉริยะ</p><a href="https://script.google.com/macros/s/AKfycbzMmqNlT9ivhoOn4AFJUU6k9CDpPqTR1AWML3D2-C55AWtYTyvGNjREQlh8Z2KDDg/exec">เข้าสู่ระบบ BAAC POS →</a><button id="install" hidden>ติดตั้งแอป</button><small id="help">ติดตั้งผ่านเมนูเบราว์เซอร์: เพิ่มไปยังหน้าจอโฮม หรือ ติดตั้งแอป<br>การใช้งานระบบขายต้องเชื่อมต่ออินเทอร์เน็ต</small></main><script>let promptEvent;const button=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;button.hidden=false});button.addEventListener('click',async()=>{if(!promptEvent)return;const p=promptEvent;promptEvent=null;button.hidden=true;await p.prompt()});if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.getElementById('help').textContent='การใช้งานระบบขายต้องเชื่อมต่ออินเทอร์เน็ต';if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);</script></body></html>
